<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Sanchara | HOD Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.10/dist/dotlottie-wc.js" type="module"></script>

    <link rel="stylesheet" href="css/hod.css" />

    <style>
        .hod-header-photo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e5e7eb;
            background: #f3f4f6;
        }
    </style>
</head>

<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<aside class="side-panel" id="sidePanel">

    <div class="sidebar-top">
        <div class="logo-section">
            <div class="logo-text">
                <img src="https://i.postimg.cc/JhLRjkbv/sanchara-logo-white-transparent.png"
                     style="width: 100%; max-width: 210px; padding: 10px; border-radius: 12px;" />
            </div>
        </div>

        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>

        <button class="mobile-close-btn" id="mobileCloseBtn">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <p class="menu-label">Main Menu</p>

    <nav class="nav-menu">

        <div class="nav-item">
            <a href="#" class="nav-link active" data-page="dashboard" onclick="showDashboard(event)">
                <i class="fa-solid fa-chart-bar"></i>
                <span>Dashboard</span>
            </a>
        </div>

        <div class="nav-item">
            <a href="#" class="nav-link" onclick="loadPage(event, 'pending-request.html', 'Pending Requests')">
                <i class="fa-solid fa-inbox"></i>
                <span>Pending Requests</span>
            </a>
        </div>

         <div class="nav-item">
            <a href="#" class="nav-link" onclick="loadPage(event, 'certificate-tracking.html', 'Certificate Tracking')">
                <i class="fa-solid fa-certificate"></i>
                <span>Certificate Tracking</span>
            </a>
        </div>

        
        <div class="nav-item">
            <a href="#" class="nav-link" onclick="loadPage(event, 'hod-students.html', 'Students')">
                <i class="fa-solid fa-users"></i>
                <span>Students</span>
            </a>
        </div>

       <div class="nav-item">
            <a href="#" class="nav-link" onclick="loadPage(event, 'allstudents.html', 'All Requests')">
                <i class="fa-solid fa-list-check"></i>
                <span>All Requests</span>
            </a>
        </div>


        <!-- <div class="nav-item">
            <a href="#" class="nav-link" onclick="loadPage(event, 'reminders.html', 'Reminders')">
                <i class="fa-solid fa-bell"></i>
                <span>Reminders</span>
            </a>
        </div> -->

    </nav>

    <nav class="nav-menu nav-bottom">
        <p class="menu-label">Account</p>

        <div class="nav-item">
            <a href="#" class="nav-link" onclick="loadPage(event, 'hod-profile.html', 'HOD Profile')">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </div>

        <div class="nav-item" id="updatePasswordNav">
            <a href="#" class="nav-link" onclick="loadPage(event, 'hod-password.html', 'Update Password')">
                <i class="fa-solid fa-key"></i>
                <span>Update Password</span>
            </a>
        </div>

        <div class="nav-item">
            <a href="#" class="nav-link logout-link" onclick="logout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>

    </nav>

</aside>

<main class="main-wrapper">

    <div class="mobile-top-bar">
        <button class="mobile-hamburger" id="mobileMenuBtn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <h1 class="mobile-logo">
            <img src="https://i.postimg.cc/vB9nm9tV/sanchara-logo-clean.png" style="width: 200px;">
        </h1>

        <div class="mobile-top-actions">
            <button class="mobile-profile-btn" type="button" onclick="loadHodProfilePage(event)" title="Profile">
                <img id="mobileHodHeaderPhoto" class="hod-header-photo" src="" alt="HOD Photo" loading="lazy" />
            </button>
        </div>
    </div>

    <header class="top-header">

        <div class="welcome-msg">
            <h2>
                <i class="fa-solid fa-chart-bar"></i>
                <span id="pageTitle">Dashboard</span>
            </h2>
            <p id="pageSubtitle">Overview of requests and certificate submissions.</p>
        </div>

        <div class="user-profile-card">

            <img id="hodHeaderPhoto" class="hod-header-photo" src="" alt="HOD Photo" loading="lazy" />

            <div class="profile-info">
                <span class="user-name" id="hodName">HOD</span>
                <span class="user-id" id="hodEmployeeId">Employee ID</span>
            </div>

        </div>

    </header>

    <section id="dashboardSection">

       <div class="stats-grid">

    <div class="stat-card card-total">
        <div class="stat-icon">
            <dotlottie-wc src="https://lottie.host/18d9adb3-f267-49a5-9460-871688368c05/DrrrY5m7x7.lottie" style="width:60px;height:60px" autoplay loop></dotlottie-wc>
        </div>
        <div>
            <div class="stat-val" id="totalCount">00</div>
            <div class="stat-label">Total Requests</div>
        </div>
    </div>

    <div class="stat-card card-approved">
        <div class="stat-icon">
            <dotlottie-wc src="https://lottie.host/58a2824f-7b40-4856-942b-3960faa89a20/MIbr0DRH6i.lottie" style="width:60px;height:60px" autoplay loop></dotlottie-wc>
        </div>
        <div>
            <div class="stat-val" id="approvedCount">00</div>
            <div class="stat-label">Approved</div>
        </div>
    </div>

    <div class="stat-card card-pending">
        <div class="stat-icon">
            <dotlottie-wc src="https://lottie.host/d6b8e14e-296b-438c-8021-45f302ff9be0/T0wF6Cjttt.lottie" style="width:60px;height:60px" autoplay loop></dotlottie-wc>
        </div>
        <div>
            <div class="stat-val" id="pendingCount">00</div>
            <div class="stat-label">Pending</div>
        </div>
    </div>

    <div class="stat-card card-rejected">
        <div class="stat-icon">
            <dotlottie-wc src="https://lottie.host/22f76931-e732-46c1-8bf0-1fbf6ec78868/w0z4LHH3eD.lottie" style="width:60px;height:60px" autoplay loop></dotlottie-wc>
        </div>
        <div>
            <div class="stat-val" id="rejectedCount">00</div>
            <div class="stat-label">Rejected</div>
        </div>
    </div>

    <div class="stat-card card-cert">
        <div class="stat-icon">
            <dotlottie-wc src="https://lottie.host/36132b7c-fc6c-4c8f-9e07-b34f5fcd7942/LKdksCDuRP.lottie" style="width:60px;height:60px" autoplay loop></dotlottie-wc>
        </div>
        <div>
            <div class="stat-val" id="certificatePendingCount">00</div>
            <div class="stat-label">Certificates Pending</div>
        </div>
    </div>

</div>

    </section>

    <section id="iframeSection" class="hidden">
        <div class="iframe-card">
            <iframe id="contentFrame"></iframe>
        </div>
    </section>

</main>

<script src="js/hod.js"></script>

</body>
</html>
