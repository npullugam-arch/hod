<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Student Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/admin-student.css" />
</head>
<body>
    <div class="student-admin-page">
        <div class="toolbar">
            <div class="toolbar-left">
                <input type="text" id="searchInput" placeholder="Search by roll number, name, branch, section, phone" />
            </div>

            <div class="toolbar-right">
                <select id="branchFilter">
                    <option value="">All Branches</option>
                </select>

                <select id="sectionFilter">
                    <option value="">All Sections</option>
                </select>

                <select id="semFilter">
                    <option value="">All Semesters</option>
                </select>
            </div>
        </div>

        <div id="pageStatus" class="page-status"></div>
        <div id="studentGrid" class="student-grid"></div>
        <div class="pagination-bar">
            <div id="paginationSummary" class="pagination-summary">Loading students...</div>
            <div class="pagination-controls">
                <button type="button" id="prevPageBtn" class="pagination-btn">Previous</button>
                <span id="pageIndicator" class="page-indicator">Page 1</span>
                <button type="button" id="nextPageBtn" class="pagination-btn">Next</button>
            </div>
        </div>

        <div id="emptyState" class="empty-state" style="display:none;">
            No students found.
        </div>
    </div>

    <div id="detailsModal" class="modal-overlay">
        <div class="modal-card large-modal">
            <div class="modal-header">
                <h2>Update Student Details</h2>
                <button type="button" class="close-btn" id="closeDetailsModal">×</button>
            </div>

            <form id="detailsForm" class="details-form">
                <input type="hidden" id="detailStudentId" />

                <h3 class="form-section-title">Basic Details</h3>
                <div id="basicFieldsGrid" class="form-grid"></div>

                <h3 class="form-section-title">Excel Extra Details</h3>
                <div id="extraExcelFieldsGrid" class="form-grid"></div>

                <div id="detailsStatus" class="modal-status"></div>

                <div class="modal-actions">
                    <button type="button" class="secondary-btn" id="cancelDetailsBtn">Cancel</button>
                    <button type="submit" class="primary-btn">Save Details</button>
                </div>
            </form>
        </div>
    </div>

    <div id="passwordModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Update Student Password</h2>
                <button type="button" class="close-btn" id="closePasswordModal">×</button>
            </div>

            <form id="passwordForm" class="details-form">
                <input type="hidden" id="passwordStudentId" />

                <div class="form-field">
                    <label>Old Password</label>
                    <input type="text" id="oldPassword" readonly />
                </div>

                <div class="form-field">
                    <label>New Password</label>
                    <input type="text" id="newPassword" required />
                </div>

                <div class="form-field">
                    <label>Confirm Password</label>
                    <input type="text" id="confirmPassword" required />
                </div>

                <div id="passwordStatus" class="modal-status"></div>

                <div class="modal-actions">
                    <button type="button" class="secondary-btn" id="cancelPasswordBtn">Cancel</button>
                    <button type="submit" class="primary-btn">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin-student.js"></script>
</body>
</html>
