<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Update Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/password.css" />
</head>

<body>
    <div class="app-shell">
        <div class="premium-layout">

            <section class="visual-panel">
                <div class="visual-card">
                    <div class="lottie-wrapper">
                        <iframe
                            src="https://lottie.host/embed/1f8b8059-d6ba-493e-b5ee-7bcf870067af/vLxVMJgmWQ.lottie"
                            class="lottie-frame"
                            title="Security Animation">
                        </iframe>
                    </div>
                </div>
            </section>

            <section class="form-panel">
                <div class="form-card">
                    <div class="card-glow"></div>

                    <div class="brand-block">
                        <div class="brand-icon">
                            <i class="fa-solid fa-key"></i>
                        </div>

                        <div>
                            <p class="top-label">Account Security</p>
                            <h1 class="main-heading">Update Password</h1>
                            <p class="sub-heading">
                                Update your password for future logins.
                            </p>
                        </div>
                    </div>

                    <form id="passwordForm" novalidate>
                        <div class="input-group">
                            <label for="newPassword">New Password</label>
                            <div class="input-shell">
                                <input type="password" id="newPassword" placeholder="Enter new password" />
                                <button type="button" class="eye-toggle" data-target="newPassword">
                                    <i class="fas fa-eye-slash icon-show"></i>
                                    <i class="fas fa-eye icon-hide"></i>
                                </button>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="confirmPassword">Confirm New Password</label>
                            <div class="input-shell">
                                <input type="password" id="confirmPassword" placeholder="Confirm new password" />
                                <button type="button" class="eye-toggle" data-target="confirmPassword">
                                    <i class="fas fa-eye-slash icon-show"></i>
                                    <i class="fas fa-eye icon-hide"></i>
                                </button>
                            </div>
                        </div>

                        <div id="passwordMessage" class="status-message"></div>

                        <div class="action-bar">
                            <button type="submit" id="updatePasswordBtn" class="btn btn-primary">
                                Update Password
                            </button>
                            <button type="reset" id="resetBtn" class="btn btn-secondary">
                                Reset
                            </button>
                        </div>
                    </form>
                </div>
            </section>

        </div>
    </div>

    <script src="js/password.js"></script>
</body>
</html>
