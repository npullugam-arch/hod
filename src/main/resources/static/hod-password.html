<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Password</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: #f8fafc;
            padding: 24px;
        }

        .password-card {
            max-width: 520px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #111827;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 700;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .msg {
            margin-top: 16px;
            font-weight: 700;
            text-align: center;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>

<div class="password-card" id="passwordCard">
    <h2>Update Password</h2>
    <p>Change your HOD login password securely. You can update password only one time.</p>

    <form id="passwordForm">
        <label>Current Password</label>
        <input type="password" id="oldPassword" required>

        <label>New Password</label>
        <input type="password" id="newPassword" required minlength="4">

        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" required minlength="4">

        <button type="submit">Update Password</button>

        <div id="message" class="msg"></div>
    </form>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
        window.top.location.href = "index.html";
    }

    const form = document.getElementById("passwordForm");
    const message = document.getElementById("message");

    if (user.passwordChanged === true) {
        form.style.display = "none";
        message.textContent = "Password already updated. You cannot change it again.";
        message.classList.add("error");
    }

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const oldPassword = document.getElementById("oldPassword").value.trim();
        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();

        message.textContent = "";
        message.className = "msg";

        if (newPassword !== confirmPassword) {
            message.textContent = "New password and confirm password do not match.";
            message.classList.add("error");
            return;
        }

        try {
            const response = await fetch("/auth/update-password", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    userId: user.id,
                    oldPassword: oldPassword,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                })
            });

            const result = await response.text();

            if (!response.ok) {
                throw new Error(result || "Password update failed");
            }

            user.passwordChanged = true;
            localStorage.setItem("user", JSON.stringify(user));

            message.textContent = "Password updated successfully.";
            message.classList.add("success");
            form.reset();

            setTimeout(() => {
                window.top.location.href = "hod.html";
            }, 1200);

        } catch (error) {
            message.textContent = error.message;
            message.classList.add("error");
        }
    });
</script>

</body>
</html>
